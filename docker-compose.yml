services:
  db:
    image: pgvector/pgvector:pg16
    container_name: memetize-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: memetize
      POSTGRES_PASSWORD: memetize
      POSTGRES_DB: memetize
    ports:
      - "5433:5432"
    volumes:
      - memetize-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memetize -d memetize"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  memetize-pgdata:
