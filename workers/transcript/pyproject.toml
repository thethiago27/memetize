[project]
name = "transcript-worker"
version = "0.1.0"
description = "Transcription worker for memetize (Node <-> Python stdin/stdout protocol)"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
# Local Apple Silicon transcription (spec section 17), installed on demand
# with: uv sync --extra mlx. The default "fixture" path needs none of this.
mlx = ["mlx-whisper>=0.4"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
