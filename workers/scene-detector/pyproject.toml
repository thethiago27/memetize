[project]
name = "scene-detector"
version = "0.1.0"
description = "PySceneDetect worker for memetize (Node <-> Python stdin/stdout protocol)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "scenedetect>=0.6.4",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
